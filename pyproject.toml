[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "spherejepa"
version = "0.1.0"
description = "SPHEREJEPA and LEJEPA: self-supervised learning, online probing and retrieval"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
  "torch>=2.2",
  "torchvision>=0.17",
  "lightning>=2.2,<3",
  "numpy>=1.26",
  "scipy>=1.11",
  "Pillow>=10",
  "PyYAML>=6",
  "matplotlib>=3.8",
  "lightly>=1.5.26",
  "kornia>=0.9.0",
  "timm>=1.0",
]

[project.optional-dependencies]
hf = ["datasets>=2.19"]

[dependency-groups]
dev = ["ipykernel>=6.29"]

[tool.setuptools]
py-modules = ["parameters", "utils", "run_utils", "evaluation", "run_pretrained", "run_retrieval"]

[tool.setuptools.packages.find]
namespaces = true
include = ["losses*", "dataloaders*", "lightningmodules*"]
